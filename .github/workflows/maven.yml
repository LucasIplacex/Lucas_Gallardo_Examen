name: CI - Pruebas Automatizadas Java

on:
  push:
    branches:
      - main
      - develop
      - feature/estructura-proyecto
  pull_request:
    branches:
      - main
      - develop

jobs:
  pruebas:
    name: Compilar y ejecutar pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y ejecutar pruebas unitarias
        run: mvn --batch-mode clean test
